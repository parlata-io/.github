name: Task
description: A specific piece of work
type: Task
body:
  - type: textarea
    id: work
    attributes:
      label: Work
      description: What needs doing.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checks that show the work is finished.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links, related issues and notes.
