name: Feature
description: A request, idea, or new functionality
type: Feature
body:
  - type: textarea
    id: need
    attributes:
      label: Need
      description: Who needs this and why.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
